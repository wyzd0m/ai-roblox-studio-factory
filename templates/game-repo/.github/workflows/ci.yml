name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting (StyLua)
        run: stylua --check src/

      - name: Lint (Selene)
        run: selene src/

      - name: Run tests (Lune)
        run: |
          if [ -d tests ]; then lune run tests; else echo "no tests/ directory yet"; fi

      - name: Build place (Rojo)
        run: rojo build -o build.rbxl
